name: score-service

on:
  push:
    branches:
      - main
      - devops
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install service dependencies
        run: npm ci --prefix score-service

      - name: Run service tests
        run: npm run test --prefix score-service
