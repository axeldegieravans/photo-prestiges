openapi: 3.0.3
info:
  title: Read Service API
  version: 1.0.0

servers:
  - url: http://localhost:3000

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /api/read/targets/active:
    get:
      summary: Get active targets
      responses:
        '200':
          description: Active targets returned

  /api/read/owners/me/dashboard:
    get:
      summary: Get owner dashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Owner dashboard returned
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/read/owners/me/targets/{targetId}/overview:
    get:
      summary: Get owner target overview
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: targetId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Target overview returned
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Target not found

  /api/read/participants/me/dashboard:
    get:
      summary: Get participant dashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Participant dashboard returned
        '401':
          description: Unauthorized
        '403':
          description: Forbidden