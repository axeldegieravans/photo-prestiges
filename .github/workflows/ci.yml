name: CI

on:
  push:
    branches:
      - main
      - devops
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install service dependencies
        run: |
          npm ci --prefix api-gateway
          npm ci --prefix auth-service
          npm ci --prefix register-service
          npm ci --prefix target-service
          npm ci --prefix score-service
          npm ci --prefix clock-service
          npm ci --prefix mail-service
          npm ci --prefix read-service

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test
